name: C2 newborn speed and parallel trajectory deviation
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        default: linux-windows
        options: [linux-windows, macos, all]
      workload:
        type: choice
        default: all
        options: [all, human, reincarnator, large-native, births]
permissions:
  contents: read
jobs:
  compare:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'macos' && '["macos-latest"]' || inputs.platform == 'all' && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
        workload: ${{ fromJSON(inputs.workload == 'human' && '["human"]' || inputs.workload == 'reincarnator' && '["reincarnator"]' || inputs.workload == 'large-native' && '["large-native"]' || inputs.workload == 'births' && '["births"]' || '["human","reincarnator","large-native","births"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: original
          ref: 691c6e0023a83513ad3cd386cfee2198317104d3
      - uses: actions/checkout@v4
        with:
          path: a2
          ref: eca7377c6ee53ab1f57c32fd8227c31e0d73b1cb
      - uses: actions/checkout@v4
        with:
          path: c1
          ref: 7305af8e8c8e03bec06adec2f5efdc4742974a4a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip setuptools wheel
      - if: runner.os != 'macOS'
        run: python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install './candidate[test]'
      - working-directory: a2
        run: python setup.py build_ext --inplace
      - working-directory: c1
        run: python setup.py build_ext --inplace
      - working-directory: candidate
        run: python setup.py build_ext --inplace
      - name: Compare fixed baselines and C2 with one, two and four workers
        env:
          C2_SUITE: ${{ matrix.workload }}
        run: python candidate/benchmarks/compare_c2.py --original original --a2 a2 --c1 c1 --candidate candidate --output-dir c2-evidence --suite ${{ matrix.workload }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-${{ matrix.os }}-${{ matrix.workload }}
          path: c2-evidence/
          retention-days: 30
