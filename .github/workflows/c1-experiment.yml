name: C1 speed and original trajectory deviation
on:
  push:
    branches: [codex/c1-batched-scoring]
    paths: ['*.py', 'cpp/**', 'benchmarks/**', '.github/workflows/c1-experiment.yml']
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        default: all
        options: [all, linux-windows, macos]
      workload:
        type: choice
        default: all
        options: [all, human, large, reincarnator]
permissions:
  contents: read
jobs:
  compare:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux-windows' && '["ubuntu-latest","windows-latest"]' || inputs.platform == 'macos' && '["macos-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: original
          ref: 691c6e0023a83513ad3cd386cfee2198317104d3
      - uses: actions/checkout@v4
        with:
          path: a2
          ref: eca7377c6ee53ab1f57c32fd8227c31e0d73b1cb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip setuptools wheel
      - if: runner.os != 'macOS'
        run: python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install './candidate[test]'
      - working-directory: a2
        run: python setup.py build_ext --inplace
      - working-directory: candidate
        run: python setup.py build_ext --inplace
      - name: Compare original, frozen A2, experiment off and experiment on
        env:
          C1_CASE: ${{ inputs.workload || 'all' }}
        run: python candidate/benchmarks/compare_c1.py --original original --a2 a2 --candidate candidate --output-dir c1-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c1-${{ matrix.os }}
          path: c1-evidence/
          retention-days: 30
