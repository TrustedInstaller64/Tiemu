name: A5 equivalent candidate comparisons
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: e8b73873e9938fd068196d54e26881cc36539750
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip setuptools wheel
      - if: runner.os != 'macOS'
        run: python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install './candidate[test]'
      - name: Build the frozen A4 default core
        working-directory: baseline
        run: python setup.py build_ext --inplace --force
      - name: Check neighbor contracts with the candidate macro disabled
        working-directory: candidate
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'setup.py', 'build_ext', '--inplace', '--force'], check=True)
          check = ('import pathlib, _tiemu_ffi as n; root = pathlib.Path.cwd().resolve(); '
                   'assert pathlib.Path(n.__file__).resolve().parent == root; '
                   'assert pathlib.Path(n.__core_file__).resolve().parent == root')
          subprocess.run([sys.executable, '-c', check], check=True)
          subprocess.run([sys.executable, '-m', 'pytest', '-q', 'tests/test_inorganic_neighbors.py'], check=True)
      - name: Build and verify the opt-in neighbor candidate
        shell: python
        run: |
          import pathlib, subprocess, sys
          output = pathlib.Path('evidence')
          output.mkdir(exist_ok=True)
          command = [sys.executable, 'setup.py', 'build_ext', '--inplace', '--force',
                     '--define', 'TIEMU_PRECOMPUTE_NEIGHBORS']
          result = subprocess.run(command, cwd='candidate', stdout=subprocess.PIPE,
                                  stderr=subprocess.STDOUT, text=True, encoding='utf-8', errors='replace')
          (output / 'candidate-build.log').write_text(result.stdout, encoding='utf-8')
          print(result.stdout, flush=True)
          if result.returncode:
              raise SystemExit(result.returncode)
          commands = [line for line in result.stdout.splitlines()
                      if 'tiemu_inorganic.cpp' in line and 'TIEMU_PRECOMPUTE_NEIGHBORS' in line]
          if not commands:
              raise SystemExit('Candidate compiler invocation did not show the neighbor macro')
      - name: Verify macro-build contracts including complete cells and RNG
        id: candidate_contracts
        working-directory: candidate
        run: python -m pytest -q
      - name: Characterize scoring math on the hosted platform
        working-directory: candidate
        run: python benchmarks/probe_scoring_math.py
      - name: Compare current and original generation structures
        run: python candidate/benchmarks/compare_aeonic_structures.py --source-root baseline --blocks 6 --samples 2 --output-dir evidence/aeonic
      - name: Compare neighbor geometry including actual chunked inorganic phase
        if: ${{ !cancelled() && steps.candidate_contracts.outcome == 'success' }}
        run: python candidate/benchmarks/compare_inorganic_neighbors.py --baseline baseline --candidate candidate --output-dir evidence/inorganic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a5-candidates-${{ matrix.os }}
          path: evidence/
