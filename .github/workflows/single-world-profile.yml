name: Single-world CPU bottleneck profile
on:
  push:
    branches: [codex/single-world-a]
    paths:
      - 'benchmarks/benchmark_single_world.py'
      - 'benchmarks/profile_single_world.py'
      - '.github/workflows/single-world-profile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip setuptools wheel pybind11
      - run: python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[test]"
      - name: Build the measured checkout's native module
        run: python setup.py build_ext --inplace
      - name: Profile bounded single-world phases and check observer equivalence
        run: python benchmarks/profile_single_world.py --source-root . --output-dir profile-evidence --probe-perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-world-cpu-profile
          path: profile-evidence/
