name: Single-world paired CPU performance
on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'cpp/**'
      - 'benchmarks/**'
      - '!benchmarks/diagnose_aeonic.py'
      - '!benchmarks/diagnose_macos_aeonic.py'
      - '!benchmarks/probe_scoring_math.py'
      - '!benchmarks/compare_aeonic_structures.py'
      - '!benchmarks/compare_inorganic_neighbors.py'
      - '.github/workflows/single-world-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: f2073f001af4bc3f03da6d96d5360aa9a2027e0a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip setuptools wheel
      - if: runner.os != 'macOS'
        run: python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install "./candidate[test]"
      - name: Build isolated baseline native module
        working-directory: baseline
        run: python setup.py build_ext --inplace
      - name: Build isolated candidate native module
        working-directory: candidate
        run: python setup.py build_ext --inplace
      - name: Compare one world at a time with rotated run order
        run: python candidate/benchmarks/compare_single_world.py --baseline baseline --candidate candidate --output-dir evidence
      - name: Compare complete inorganic stages and random-state continuation
        run: python candidate/benchmarks/compare_inorganic.py --baseline baseline --candidate candidate --output-dir evidence/inorganic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-world-${{ matrix.os }}
          path: evidence/
