name: Native core and platforms
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Equivalence oracles execute the frozen upstream commit on each runner.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build standalone C++ core without Python dependencies
        run: cmake -S . -B build/standalone -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/standalone --config Release --parallel 2
      - run: ctest --test-dir build/standalone -C Release --output-on-failure
      - run: python -m pip install --upgrade pip
      - if: runner.os != 'macOS'
        run: python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[test]"
      - name: Verify the installed backend is the C ABI implementation
        run: python -c "import _tiemu_ffi as n; assert n.__binding__ == 'c-abi'; assert n.ABI_VERSION == 1"
      - run: python -m pytest -q
      - run: python -m main --disable-llm --no-interactive --device cpu --backend cpp --seed 42 --smoke-test --output-dir runs/ci
      - run: python -m main --disable-llm --no-interactive --compute-only --device cpu --backend cpp --native-threads 4 --native-min-rows 1 --seed 42 --smoke-test --output-dir runs/ci-parallel
      - name: Exercise the opt-in C1 CLI with four native workers
        run: python -m main --disable-llm --no-interactive --compute-only --device cpu --backend cpp --experimental-c-scoring --native-threads 4 --native-min-rows 1 --seed 42 --smoke-test --output-dir runs/ci-c1
      - name: Exercise C2 birth initialization and scoring with a shared four-worker pool
        run: python -m main --disable-llm --no-interactive --compute-only --device cpu --backend cpp --experimental-c-scoring --experimental-c-newborns --native-threads 4 --native-min-rows 1 --seed 42 --smoke-test --output-dir runs/ci-c2
  docker:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tiemu:cpu .
      - run: docker run --rm tiemu:cpu --disable-llm --no-interactive --device cpu --llm-device cpu --backend cpp --seed 42 --smoke-test --output-dir /data
      - run: docker run --rm tiemu:cpu --disable-llm --no-interactive --device cpu --llm-device cpu --backend cpp --experimental-c-scoring --seed 42 --smoke-test --output-dir /data
      - run: docker run --rm tiemu:cpu --disable-llm --no-interactive --device cpu --llm-device cpu --backend cpp --experimental-c-scoring --experimental-c-newborns --native-threads 4 --native-min-rows 1 --seed 42 --smoke-test --output-dir /data
