name: Native core and platforms
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Equivalence oracles execute the frozen upstream commit on each runner.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - if: runner.os != 'macOS'
        run: python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q --ignore=tests/test_native_pipeline.py --ignore=tests/test_native_evaluation.py --ignore=tests/test_training_overhead.py --ignore=tests/test_compute_runtime.py
      - name: Verify new contracts fail against the old implementation
        run: python tests/verify_expected_red.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expected-red-${{ matrix.os }}
          path: expected-red.xml
      - run: python -m main --disable-llm --no-interactive --device cpu --backend cpp --seed 42 --smoke-test --output-dir runs/ci
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tiemu:cpu .
      - run: docker run --rm tiemu:cpu --disable-llm --no-interactive --device cpu --llm-device cpu --backend cpp --seed 42 --smoke-test --output-dir /data
