[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.13,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "tiemu"
version = "0.2.0"
description = "Tiemu evolutionary simulation with a native numerical core"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "torch>=2.7,<3", "colorama>=0.4.6", "pyclog==0.1.3"]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.31,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'"]
gguf = ["llama-cpp-python>=0.3.14,<0.4"]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
